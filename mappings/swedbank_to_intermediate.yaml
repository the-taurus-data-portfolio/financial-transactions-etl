# mappings/swedbank_to_intermediate.yaml
mapping_name: "Bank Source to Intermediate Mapping"
description: "Rules for transforming the initial bank CSV data into the universal intermediate transaction format."
source_schema: "swedbank_source.yaml" # Corrected to swedbank_source.yaml
target_schema: "intermediate.yaml"

# Rules for filtering rows before processing
filters:
  - field: "Reatüüp" # Corresponds to "Reatüüp" in source schema
    operator: "equals"
    value: "20"
    description: "Only process rows where 'Reatüüp' (RowType) is '20', indicating a transaction. Exclude initial balance rows (e.g., '10')."

# Rules for mapping and transforming fields
field_mappings:
  - source_field: "Kuupäev" # From Source.Kuupäev
    target_field: "TransactionDate"
    transformation:
      type: "direct_copy"
      notes: "Date format DD.MM.YYYY remains unchanged at this stage."

  - source_field: "Summa" # From Source.Summa
    target_field: "Amount"
    transformation:
      type: "calculated_float"
      rules:
        - action: "replace_decimal_separator"
          from: ","
          to: "."
          notes: "Change comma decimal separator to dot."
        - action: "apply_sign_based_on_field"
          field_for_sign: "Deebet/Kreedit" # From Source.Deebet/Kreedit
          debit_value: "D"
          credit_value: "K"
          notes: "Multiply by -1 if DebitCredit is 'D', otherwise keep positive."

  - source_field: "Valuuta" # From Source.Valuuta
    target_field: "Currency"
    transformation:
      type: "direct_copy"

  - source_field: "Selgitus" # From Source.Selgitus
    target_field: "Description"
    transformation:
      type: "string_clean"
      rules:
        - action: "remove_leading_apostrophe"
          notes: "Remove single leading apostrophe if present (e.g., from ''2047439610')."

  - source_field: "Kliendi konto" # From Source.Kliendi konto
    target_field: "BudgetAccountNumber"
    transformation:
      type: "anonymize_iban"
      rules:
        - action: "keep_country_prefix"
          length: 2 # Assuming 2 characters for country prefix (e.g., 'EE')
        - action: "keep_last_n_digits"
          n: 5 # Keep the last 5 digits as per your example (EE***5678)
        - action: "replace_middle_with"
          character: "*"
          count: 3 # Replace middle with three asterisks
      notes: "Anonymize IBAN: keep country prefix, replace middle with '***', and keep last 5 digits. Example: EE333...5678 -> EE***5678."

  - source_field: "Saaja/Maksja" # From Source.Saaja/Maksja
    target_field: "OtherAccountName"
    transformation:
      type: "direct_copy"

  - source_field: "Arhiveerimistunnus" # New mapping for TransactionID
    target_field: "TransactionID"
    transformation:
      type: "prefix_string"
      prefix: "SW" # Prefix with "SW" for Swedbank transactions
      notes: "Map 'Arhiveerimistunnus' to 'TransactionID' and prefix with 'SW' for uniqueness."