# src/schemas/tiller_target.yaml
schema_name: "Tiller Transactions Table Schema"
description: "Schema for the Tiller Money transaction spreadsheet, for import or copy-pasting."
file_details:
  delimiter: "," # Tiller spreadsheets typically use comma for CSV export/import
  quote_char: "\""
  decimal_separator: "."
  date_format: "M/D/YYYY" # Main date format for Tiller 'Date' field
  short_date_format: "M/D/YY" # Short date format for 'Month', 'Week', 'Date Added'

fields:
  - name: "Transaction ID" # Скорректированный порядок
    type: "string"
    description: "A unique identifier for the transaction."
    nullable: true # Может быть пустым при ручном вводе
  - name: "Date"
    type: "string" # Будет отформатирован как M/D/YYYY
    description: "The date the transaction occurred."
    format: "M/D/YYYY"
  - name: "Description"
    type: "string"
    description: "A brief description of the transaction."
  - name: "Category"
    type: "string"
    description: "The assigned category for the transaction. Typically filled manually or by Tiller rules."
    nullable: true # Может быть пустым при импорте
  - name: "Amount"
    type: "float"
    description: "The transaction amount. Positive for income, negative for expenses. Uses dot '.' as decimal separator."
  - name: "Account"
    type: "string"
    description: "The user-friendly name of the account in Tiller. Often inferred by Tiller."
    nullable: true # Может быть пустым при импорте
  - name: "Account #"
    type: "string"
    description: "The account number as it appears in Tiller. Can be a masked IBAN or custom alias."
    nullable: true # Может быть пустым при импорте, Tiller может генерировать
  - name: "Account ID"
    type: "string"
    description: "A unique identifier for the account within Tiller. Generated by Tiller."
    nullable: true # Может быть пустым при импорте, Tiller генерирует
  - name: "Institution" # Добавлено сюда, как в твоем желаемом порядке
    type: "string"
    description: "The name of the financial institution."
    nullable: true
  - name: "Month"
    type: "string" # Будет отформатирован как M/D/YY
    description: "The first day of the month for the transaction date."
    format: "M/D/YY"
  - name: "Week"
    type: "string" # Будет отформатирован как M/D/YY
    description: "The first day of the week for the transaction date."
    format: "M/D/YY"
    start_of_week: "Sunday" # По умолчанию для Tiller
  - name: "Check Number"
    type: "string"
    description: "Check number for check transactions."
    nullable: true # Может быть пустым
  - name: "Full Description"
    type: "string"
    description: "An extended description field. Can mirror 'Description'."
    nullable: true # Может быть пустым
  - name: "Date Added"
    type: "string" # Будет отформатирован как M/D/YY
    description: "The date the transaction was added to Tiller (usually current date)."
    format: "M/D/YY"
  - name: "Category Hint"
    type: "string"
    description: "A suggestion for categorization. Rarely used in imports."
    nullable: true # Может быть пустым
  - name: "Categorized By"
    type: "string"
    description: "Indicates how the transaction was categorized (e.g., 'Rules'). Generated by Tiller."
    nullable: true # Может быть пустым
  - name: "Categorized Date"
    type: "string"
    description: "Date and time of categorization. Generated by Tiller."
    nullable: true # Может быть пустым
  - name: "Source"
    type: "string"
    description: "Where the transaction data came from. Generated by Tiller."
    nullable: true # Может быть пустым
  - name: "Note"
    type: "string"
    description: "General notes about the transaction."
    nullable: true
  - name: "Tags"
    type: "string"
    description: "Tags for categorization or filtering."
    nullable: true
  - name: "Merchant Name"
    type: "string"
    description: "Standardized merchant name."
    nullable: true
  - name: "From / To" # Скорректированный порядок
    type: "string"
    description: "Custom field for payee/payer. Can be manually filled or mapped from source data."
    nullable: true