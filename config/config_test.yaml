# Configuration file for Bank to Tiller ETL Pipeline - TEST CONFIG

# Logging configuration
logging:
  level: "DEBUG"
  console: true
  file:
    enabled: true
    path: "logs/etl_pipeline_test.log"
    max_size: "10MB"
    backup_count: 5

# Google Authentication
google_auth:
  credentials_file: "config/credentials/test-spreadsheet-credentials.json"

# Output configuration
output:
  intermediate_format:
    destination: "both"
    file_path: "output/intermediate_transactions_test.csv"
  tiller_format:
    destination: "both"
    file_path: "output/tiller_transactions_test.csv"
    console_limit: 50

# Processing configuration
processing:
  auto_detect_bank: false
  default_bank_type: "swedbank"
  strict_mode: true
  skip_invalid_rows: true
  copy_to_clipboard: true

# Source configuration
source:
  type: "gdrive"
  local:
    input_dir: "data/test_input"
  gdrive:
    input_folder_id: "1s6Nw0fk70nwsRkcJnwXIqOQYyBkOxvrU"

# Archiving configuration
archiving:
  enabled: true
  type: "gdrive"
  local:
    archive_dir: "data/archive"
    add_timestamp: false
  gdrive:
    archive_folder_id: "1rIxTb8H6lVn5U0-RSIvdjBBDafxRYbOL"

# File processing settings
files:
  supported_extensions: [".csv", ".CSV"]
  encoding: "utf-8"
  csv_options:
    skip_blank_lines: true
    strip_whitespace: true

# Bank source configurations
source_converters:
  swedbank:
    source_schema: swedbank_source.yaml
    mapping: swedbank_to_intermediate.yaml
    sample_files:
      - "data/samples/transactions/swedbank_sample_ee.csv"
      - "data/samples/transactions/swedbank_sample_ru.csv"
  lhv:
    source_schema: lhv_source.yaml
    mapping: lhv_to_intermediate.yaml
    sample_files:
      - "data/samples/transactions/lhv_sample_ee.csv"
  lhv_legacy:
    source_schema: lhv_legacy_source.yaml
    mapping: lhv_legacy_to_intermediate.yaml
    sample_files:
      - "data/samples/transactions/lhv_sample_legacy_ee.csv"
  seb:
    source_schema: seb_source.yaml
    mapping: seb_to_intermediate.yaml
    sample_files:
      - "data/samples/transactions/seb_sample_ee.csv"
  luminor:
    source_schema: luminor_source.yaml
    mapping: luminor_to_intermediate.yaml
    sample_files:
      - "data/samples/transactions/luminor_sample_ee.csv"

# Target system configurations
target_converters:
  tiller:
    schema: tiller_target.yaml
    mapping: intermediate_to_tiller.yaml
    accounts_file: "config/tiller/accounts_sample.yaml"
    deduplication:
      enabled: true
      spreadsheet_id: "1c2c-EUCJJW5RQgCwqoVXDU229RIP9OYxQY7opR-XBko"
      worksheet_title: "Transactions"
      table_name: "Table1"
      credentials_file: "config/credentials/test-spreadsheet-credentials.json"

# Schema and mapping paths
paths:
  schemas_dir: "schemas"
  mappings_dir: "mappings"
  output_dir: "output"
  logs_dir: "logs"
