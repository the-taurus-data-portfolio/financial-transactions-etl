# mappings/luminor_to_intermediate.yaml
mapping_name: "Luminor Bank Source to Intermediate Mapping"
description: "Rules for transforming Luminor bank CSV data into the universal intermediate transaction format."
source_schema: "luminor_source.yaml"
target_schema: "intermediate.yaml"

# No filters needed — all rows in Luminor exports are settled transactions (no header/footer type column)

field_mappings:
  - source_field: "Väärtuspäev"
    target_field: "TransactionDate"
    transformation:
      type: "direct_copy"
      notes: "Date format DD.MM.YYYY remains unchanged at this stage."

  - source_field: "Summa"
    target_field: "Amount"
    transformation:
      type: "calculated_float"
      rules:
        - action: "replace_decimal_separator"
          from: ","
          to: "."
          notes: "Change comma decimal separator to dot."
        - action: "apply_sign_based_on_field"
          field_for_sign: "Deebet/krediit"
          debit_value: "D"
          credit_value: "C"
          notes: "Multiply by -1 if Deebet/krediit is 'D', otherwise keep positive."

  - source_field: "Valuuta"
    target_field: "Currency"
    transformation:
      type: "direct_copy"

  - source_field: "Makse andmed"
    target_field: "Description"
    transformation:
      type: "string_clean"
      rules:
        - action: "remove_leading_apostrophe"

  - source_field: "Konto"
    target_field: "BudgetAccountNumber"
    transformation:
      type: "anonymize_iban"
      rules:
        - action: "keep_country_prefix"
          length: 2
        - action: "keep_last_n_digits"
          n: 5
        - action: "replace_middle_with"
          character: "*"
          count: 3
      notes: "Anonymize IBAN: keep country prefix, replace middle with '***', keep last 5 digits."

  - source_field: "Saaja/maksja nimi"
    target_field: "OtherAccountName"
    transformation:
      type: "direct_copy"

  - source_field: "Arhiveerimiskood"
    target_field: "TransactionID"
    transformation:
      type: "prefix_string"
      prefix: "LN"
      notes: "Prefix with 'LN' for Luminor bank transactions."
